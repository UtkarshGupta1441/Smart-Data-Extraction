<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Data Extraction</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap");

    :root {
      --ink: #1c1c1c;
      --muted: #4e5a60;
      --accent: #0f8b8d;
      --accent-2: #f2a154;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-border: rgba(17, 24, 39, 0.1);
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(15, 139, 141, 0.25), transparent 40%),
        radial-gradient(circle at 88% 20%, rgba(242, 161, 84, 0.24), transparent 35%),
        linear-gradient(120deg, #f7f2e7 0%, #eaf7f4 50%, #f9efe2 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        135deg,
        rgba(15, 139, 141, 0.06) 0,
        rgba(15, 139, 141, 0.06) 12px,
        transparent 12px,
        transparent 36px
      );
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 60px;
      display: grid;
      gap: 24px;
    }

    header {
      display: grid;
      gap: 8px;
      animation: rise 0.6s ease-out;
    }

    header h1 {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 3vw, 3rem);
      margin: 0;
    }

    header p {
      margin: 0;
      color: var(--muted);
      max-width: 720px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.7s ease-out;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.2);
      font-size: 1rem;
      outline: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      background: #fff;
    }

    input[type="text"]:focus {
      border-color: rgba(15, 139, 141, 0.5);
      box-shadow: 0 0 0 4px rgba(15, 139, 141, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      background: linear-gradient(130deg, var(--accent), #0b6f6f);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(15, 139, 141, 0.25);
      white-space: nowrap;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(15, 139, 141, 0.3);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 24px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 0.2s ease;
    }

    .status-dot.ok {
      background: #16a34a;
    }

    .status-dot.error {
      background: #dc2626;
    }

    .status-dot.loading {
      background: #f59e0b;
      animation: pulse 1s infinite ease-in-out;
    }

    .gallery-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .gallery-header h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 139, 141, 0.12);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .group {
      margin-bottom: 20px;
      animation: fadeIn 0.6s ease-out;
    }

    .group h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .gallery-shell {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
      gap: 18px;
    }

    .gallery-shell[data-ready="false"] .folder-panel,
    .gallery-shell[data-ready="false"] .viewer-header,
    .gallery-shell[data-ready="false"] .grid {
      display: none;
    }

    .folder-panel {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      display: grid;
      gap: 12px;
      align-content: start;
      min-height: 220px;
    }

    .folder-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .folder-search {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.15);
      font-size: 0.9rem;
      outline: none;
      background: #fff;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .folder-search:focus {
      border-color: rgba(15, 139, 141, 0.4);
      box-shadow: 0 0 0 3px rgba(15, 139, 141, 0.12);
    }

    .folder-section {
      display: grid;
      gap: 8px;
    }

    .folder-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .folder-list {
      display: grid;
      gap: 8px;
      max-height: 520px;
      overflow: auto;
      padding-right: 4px;
    }

    .folder-item {
      border: 1px solid transparent;
      background: rgba(15, 139, 141, 0.08);
      color: var(--accent);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .folder-item:hover {
      background: rgba(15, 139, 141, 0.15);
    }

    .folder-item.active {
      background: var(--accent);
      color: #fff;
      border-color: rgba(15, 139, 141, 0.4);
    }

    .folder-item .count {
      float: right;
      font-weight: 600;
      opacity: 0.8;
    }

    .subfolder-item {
      background: rgba(242, 161, 84, 0.16);
      color: #c05f12;
    }

    .subfolder-item.active {
      background: var(--accent-2);
      color: #fff;
    }

    .viewer {
      display: grid;
      gap: 14px;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .viewer-header h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
    }

    .card img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 4 / 3;
      background: #f4f4f5;
    }

    .card .meta {
      padding: 0 12px;
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-word;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.55);
      padding: 24px;
      z-index: 10;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
      max-width: min(900px, 92vw);
      width: 100%;
      display: grid;
      gap: 12px;
      position: relative;
    }

    .modal-card img {
      width: 100%;
      max-height: min(70vh, 720px);
      object-fit: contain;
      border-radius: 12px;
      background: #f4f4f5;
    }

    .modal-caption {
      color: var(--muted);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      background: rgba(15, 23, 42, 0.12);
      color: var(--ink);
      border-radius: 999px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1.1rem;
      display: grid;
      place-items: center;
      box-shadow: none;
    }

    .empty {
      padding: 24px;
      border-radius: 16px;
      border: 1px dashed rgba(15, 23, 42, 0.2);
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.75);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.35);
      }
    }

    @media (max-width: 720px) {
      .input-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .gallery-shell {
        grid-template-columns: 1fr;
      }

      .folder-panel {
        order: 2;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Smart Data Extraction</h1>
      <p>Paste a URL, run the pipeline, and browse the detected outputs right here.</p>
    </header>

    <section class="panel">
      <form id="runForm">
        <label for="urlInput"><strong>Target URL</strong></label>
        <div class="input-row">
          <input id="urlInput" name="url" type="text" placeholder="https://example.com" autocomplete="off" />
          <button id="runButton" type="submit">Run Extraction</button>
        </div>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Ready to run.</span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="gallery-header">
        <h2>Output Gallery</h2>
        <span id="imageCount" class="pill">0 images</span>
      </div>
      <div id="galleryShell" class="gallery-shell" data-ready="false">
        <aside class="folder-panel">
          <div class="folder-title">Folders</div>
          <input id="folderSearch" class="folder-search" type="text" placeholder="Filter screenshots..." />
          <div class="folder-section">
            <div class="folder-label">Screenshots</div>
            <div id="topFolderList" class="folder-list"></div>
          </div>
          <div class="folder-section">
            <div id="subfolderLabel" class="folder-label">Subfolders</div>
            <div id="subFolderList" class="folder-list"></div>
          </div>
        </aside>
        <div class="viewer">
          <div class="viewer-header">
            <h3 id="folderHeading">Select a folder</h3>
            <span id="folderCount" class="pill">0 images</span>
          </div>
          <div id="imageGrid" class="grid"></div>
          <div id="emptyState" class="empty">
            Run extraction to load outputs. Images will appear by folder.
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="imageModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card" role="document">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
      <img id="modalImage" src="" alt="" />
      <div id="modalCaption" class="modal-caption"></div>
    </div>
  </div>

  <script>
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const runButton = document.getElementById("runButton");
    const urlInput = document.getElementById("urlInput");
    const imageCount = document.getElementById("imageCount");
    const galleryShell = document.getElementById("galleryShell");
    const folderSearch = document.getElementById("folderSearch");
    const topFolderList = document.getElementById("topFolderList");
    const subFolderList = document.getElementById("subFolderList");
    const subfolderLabel = document.getElementById("subfolderLabel");
    const imageGrid = document.getElementById("imageGrid");
    const emptyState = document.getElementById("emptyState");
    const folderHeading = document.getElementById("folderHeading");
    const folderCount = document.getElementById("folderCount");
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalCaption = document.getElementById("modalCaption");
    const modalClose = document.getElementById("modalClose");

    let hierarchy = {};
    let activeTop = null;
    let activeSub = null;
    let topClickBound = false;
    let subClickBound = false;

    function setStatus(message, state) {
      statusText.textContent = message;
      statusDot.className = "status-dot" + (state ? " " + state : "");
    }

    function updateCount(count) {
      imageCount.textContent = count + (count === 1 ? " image" : " images");
    }

    function naturalSort(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
    }

    function buildHierarchy(images) {
      const tree = {};
      images.forEach((img) => {
        const parts = (img.folder || "root").split("/").filter(Boolean);
        const top = parts[0] || "root";
        const sub = parts.slice(1).join("/") || "root";

        if (!tree[top]) {
          tree[top] = { all: [], subs: {} };
        }
        tree[top].all.push(img);
        if (!tree[top].subs[sub]) {
          tree[top].subs[sub] = [];
        }
        tree[top].subs[sub].push(img);
      });
      return tree;
    }

    function setGalleryReady(ready) {
      galleryShell.dataset.ready = ready ? "true" : "false";
      if (!ready) {
        emptyState.textContent = "Run extraction to load outputs. Images will appear by folder.";
        emptyState.style.display = "block";
      }
    }

    function renderTopFolders(filterValue) {
      const filter = (filterValue || "").trim().toLowerCase();
      topFolderList.innerHTML = "";
      const topKeys = Object.keys(hierarchy).sort(naturalSort);

      topKeys.forEach((top) => {
        if (filter && !top.toLowerCase().includes(filter)) {
          return;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "folder-item";
        button.dataset.top = top;
        button.innerHTML = `${top} <span class="count">${hierarchy[top].all.length}</span>`;
        topFolderList.appendChild(button);
      });

      if (activeTop && !topKeys.includes(activeTop)) {
        activeTop = null;
      }
    }

    function renderSubfolders() {
      subFolderList.innerHTML = "";
      if (!activeTop || !hierarchy[activeTop]) {
        subfolderLabel.textContent = "Subfolders";
        return;
      }

      const subs = Object.keys(hierarchy[activeTop].subs).sort(naturalSort);
      subfolderLabel.textContent = `Subfolders (${subs.length})`;

      const allButton = document.createElement("button");
      allButton.type = "button";
      allButton.className = "folder-item subfolder-item";
      allButton.dataset.sub = "__all__";
      allButton.innerHTML = `All ${activeTop} <span class="count">${hierarchy[activeTop].all.length}</span>`;
      subFolderList.appendChild(allButton);

      subs.forEach((sub) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "folder-item subfolder-item";
        button.dataset.sub = sub;
        button.innerHTML = `${sub} <span class="count">${hierarchy[activeTop].subs[sub].length}</span>`;
        subFolderList.appendChild(button);
      });
    }

    function renderImagesForSelection() {
      imageGrid.innerHTML = "";
      if (!activeTop || !hierarchy[activeTop]) {
        folderHeading.textContent = "Select a screenshot folder";
        folderCount.textContent = "0 images";
        emptyState.textContent = "Pick a screenshot folder to view images.";
        emptyState.style.display = "block";
        return;
      }

      const topData = hierarchy[activeTop];
      let images = [];
      let heading = activeTop;

      if (!activeSub || activeSub === "__all__") {
        images = topData.all;
        heading = `${activeTop} / all`;
      } else {
        images = topData.subs[activeSub] || [];
        heading = `${activeTop} / ${activeSub}`;
      }

      folderHeading.textContent = heading;
      folderCount.textContent = images.length + (images.length === 1 ? " image" : " images");

      if (!images.length) {
        emptyState.textContent = "No images found for this folder.";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      images.forEach((img) => {
        const card = document.createElement("div");
        card.className = "card";

        const image = document.createElement("img");
        image.src = img.url;
        image.alt = img.name;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = img.name;

        card.appendChild(image);
        card.appendChild(meta);
        imageGrid.appendChild(card);
      });

      document.querySelectorAll(".folder-item").forEach((button) => {
        if (button.dataset.top) {
          button.classList.toggle("active", button.dataset.top === activeTop);
        }
        if (button.dataset.sub) {
          button.classList.toggle("active", button.dataset.sub === (activeSub || "__all__"));
        }
      });
    }

    function renderImages(images) {
      updateCount(images.length);
      hierarchy = buildHierarchy(images);
      setGalleryReady(true);

      if (!images.length) {
        emptyState.textContent = "No images yet. Run a URL to generate outputs.";
        emptyState.style.display = "block";
        topFolderList.innerHTML = "";
        subFolderList.innerHTML = "";
        imageGrid.innerHTML = "";
        folderHeading.textContent = "No outputs";
        folderCount.textContent = "0 images";
        return;
      }

      emptyState.style.display = "none";
      activeTop = Object.keys(hierarchy).sort(naturalSort)[0] || null;
      activeSub = "__all__";
      renderTopFolders(folderSearch.value);
      renderSubfolders();
      renderImagesForSelection();

      if (!topClickBound) {
        topFolderList.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) {
            return;
          }
          const folderKey = target.dataset.top;
          if (!folderKey) {
            return;
          }
          activeTop = folderKey;
          activeSub = "__all__";
          renderSubfolders();
          renderImagesForSelection();
        });
        topClickBound = true;
      }

      if (!subClickBound) {
        subFolderList.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) {
            return;
          }
          const subKey = target.dataset.sub;
          if (!subKey) {
            return;
          }
          activeSub = subKey;
          renderImagesForSelection();
        });
        subClickBound = true;
      }

      folderSearch.addEventListener("input", () => {
        renderTopFolders(folderSearch.value);
      });
    }

    folderSearch.addEventListener("input", () => {
      renderTopFolders(folderSearch.value);
      }
    }

    function openModal(src, caption) {
      modalImage.src = src;
      modalImage.alt = caption || "";
      modalCaption.textContent = caption || "";
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
      modalCaption.textContent = "";
    }

    imageGrid.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLImageElement)) {
        return;
      }
      openModal(target.src, target.alt);
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    modalClose.addEventListener("click", closeModal);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closeModal();
      }
    });

    document.getElementById("runForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const url = urlInput.value.trim();
      if (!url) {
        setStatus("Please enter a URL.", "error");
        return;
      }

      runButton.disabled = true;
      setStatus("Running extraction. This can take a while...", "loading");

      try {
        const res = await fetch("/api/run", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || "Request failed");
        }

        const data = await res.json();
        renderImages(data.images || []);
        setStatus("Extraction complete.", "ok");
      } catch (err) {
        setStatus(err.message || "Extraction failed.", "error");
      } finally {
        runButton.disabled = false;
      }
    });

    setGalleryReady(false);
  </script>
</body>
</html>
